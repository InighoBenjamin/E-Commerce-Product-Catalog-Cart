# ========================
# APPLICATION CONFIGURATION
# ========================
spring.application.name=ecommerce-product-catalog
server.port=8080

# ========================
# H2 IN-MEMORY DATABASE (Default - No Setup Required)
# ========================
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================
# JPA / HIBERNATE
# ========================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# ========================
# DATA INITIALIZATION
# ========================
spring.sql.init.mode=always

# ========================
# CORS (Allow React frontend on port 5173)
# ========================
# Handled programmatically in WebConfig.java

